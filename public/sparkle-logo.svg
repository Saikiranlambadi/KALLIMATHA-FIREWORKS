<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE58F" />
      <stop offset="45%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#8C6514" />
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <circle cx="50" cy="50" r="46" fill="#08090C" stroke="#D4AF37" stroke-width="2.5"/>
  <!-- Central Spark -->
  <path d="M 50 15 C 50 35 65 50 85 50 C 65 50 50 65 50 85 C 50 65 35 50 15 50 C 35 50 50 35 50 15 Z" fill="url(#goldGlow)" filter="url(#glow)"/>
  <!-- Diagonal sparks -->
  <path d="M 50 28 C 50 42 58 50 72 50 C 58 50 50 58 50 72 C 50 58 42 50 28 50 C 42 50 50 42 50 28 Z" fill="#FFF6D1" transform="rotate(45 50 50)"/>
  <!-- Micro sparkles -->
  <circle cx="50" cy="50" r="3" fill="#FFFFFF"/>
</svg>

